[workspace]
resolver = "2"
members = ["crates/fb-core", "crates/fb-gpu", "crates/fb-cuda", "crates/fb-capsule", "crates/fb-client", "crates/frostd", "crates/workloads"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
anyhow = "1"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-metal = "0.3"
sha2 = "0.10"
fb-core = { path = "crates/fb-core" }
fb-gpu = { path = "crates/fb-gpu" }
fb-capsule = { path = "crates/fb-capsule" }
fb-client = { path = "crates/fb-client" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
