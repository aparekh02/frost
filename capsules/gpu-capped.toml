# A capsule given low-level GPU access but capped so it can't take the whole device:
# at most 20% of GPU time and 4 command buffers in flight, 300 MiB of GPU memory. It floods
# the GPU on purpose; `frostd ctl ps` (or the run report) shows it held to ~20%.
name = "gpu-capped"
exec = "../target/release/crypto-hash"
args = ["--n", "1048576", "--len", "200", "--rounds", "400"]
[cpu]
class = "performance"
[memory]
limit_mb = 512
[gpu]
arena_mb = 300
max_percent = 20
max_inflight = 4
